services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ownershipgraph
      POSTGRES_USER: ownershipgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ownershipgraph']
      interval: 5s
      retries: 20
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes: [neo4j-data:/data]
    ports: ['127.0.0.1:7474:7474']
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ownershipgraph:${POSTGRES_PASSWORD}@postgres/ownershipgraph
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODEL_PATH: /models/anomaly.joblib
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:8080:80']
    depends_on: [backend]
volumes:
  postgres-data:
  neo4j-data:
